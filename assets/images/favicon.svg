<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#f5a400"/>
      <stop offset="100%" stop-color="#d48200"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252a"/>
      <stop offset="100%" stop-color="#0f1113"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect width="128" height="128" rx="28" fill="url(#darkGrad)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Excavator Graphic in Center -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Soil / Ground mound -->
    <path d="M 6 86 Q 30 76 60 84 Q 85 89 104 84 L 104 90 L 6 90 Z" fill="#78481e" opacity="0.9"/>
    
    <!-- Tracks / Undercarriage -->
    <rect x="18" y="74" width="70" height="15" rx="7.5" fill="#1b1c1e" stroke="#f5a400" stroke-width="1.8"/>
    <!-- Track rollers -->
    <circle cx="28" cy="81.5" r="4.5" fill="#f5a400"/>
    <circle cx="43" cy="81.5" r="4.5" fill="#f5a400"/>
    <circle cx="58" cy="81.5" r="4.5" fill="#f5a400"/>
    <circle cx="73" cy="81.5" r="4.5" fill="#f5a400"/>
    <rect x="22" y="79" width="62" height="4" rx="2" fill="#111"/>

    <!-- Cabin / Body -->
    <path d="M 32 73 L 32 46 Q 32 42 36 42 L 64 42 Q 68 42 70 46 L 76 60 L 76 73 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="2"/>
    <!-- Cab Window -->
    <path d="M 36 46 L 56 46 L 56 62 L 36 62 Z" fill="#15222e" stroke="#2c3e50" stroke-width="1.5"/>
    <path d="M 39 49 L 53 49 L 53 59 L 39 59 Z" fill="#3880a4" opacity="0.8"/>
    <!-- Window glare reflection -->
    <polygon points="40,58 50,49 46,49 39,56" fill="#fff" opacity="0.6"/>

    <!-- Boom Arm -->
    <path d="M 66 60 L 78 30 Q 82 22 90 26 L 98 42 L 92 48 L 84 34 L 72 65 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="1.5"/>
    <!-- Hydraulic Cylinder -->
    <line x1="68" y1="58" x2="82" y2="40" stroke="#silver" stroke-width="3"/>
    <line x1="68" y1="58" x2="82" y2="40" stroke="#111" stroke-width="1"/>

    <!-- Arm Stick / Dipper -->
    <path d="M 90 26 L 102 52 L 96 56 L 85 30 Z" fill="url(#goldGrad)" stroke="#111" stroke-width="1.5"/>

    <!-- Bucket -->
    <path d="M 101 50 Q 112 55 106 68 Q 96 74 92 64 L 95 56 Z" fill="#2a2d32" stroke="#f5a400" stroke-width="1.5"/>
    <!-- Bucket teeth -->
    <polygon points="106,66 109,70 106,71" fill="#f5a400"/>
    <polygon points="102,68 105,73 101,73" fill="#f5a400"/>
    <polygon points="97,67 99,72 96,71" fill="#f5a400"/>
  </g>

  <!-- Banner text: HUSNI RENTAL at bottom -->
  <rect x="10" y="96" width="108" height="22" rx="5" fill="#f5a400"/>
  <text x="64" y="112" font-family="'Inter', Impact, Arial, sans-serif" font-weight="900" font-size="13" fill="#111" text-anchor="middle" letter-spacing="1">HUSNI RENTAL</text>
</svg>
