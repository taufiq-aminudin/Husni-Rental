<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="35%" stop-color="#f5a400"/>
      <stop offset="100%" stop-color="#bf7600"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cfd4d9"/>
      <stop offset="100%" stop-color="#8a9299"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23272d"/>
      <stop offset="100%" stop-color="#121417"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(6, 6)">
    <rect width="68" height="68" rx="16" fill="url(#badgeGrad)" stroke="#f5a400" stroke-width="2"/>
    
    <!-- Mini Excavator in Badge -->
    <g transform="translate(6, 6) scale(0.55)">
      <!-- Track -->
      <rect x="10" y="70" width="80" height="18" rx="9" fill="#181a1d" stroke="#f5a400" stroke-width="2"/>
      <circle cx="22" cy="79" r="5" fill="#f5a400"/>
      <circle cx="39" cy="79" r="5" fill="#f5a400"/>
      <circle cx="56" cy="79" r="5" fill="#f5a400"/>
      <circle cx="73" cy="79" r="5" fill="#f5a400"/>
      
      <!-- Body & Cab -->
      <path d="M 24 68 L 24 38 Q 24 34 28 34 L 58 34 Q 62 34 66 38 L 72 52 L 72 68 Z" fill="url(#goldText)" stroke="#111" stroke-width="2"/>
      <rect x="28" y="38" width="22" height="18" fill="#1c2b38" stroke="#3d5a73" stroke-width="1.5"/>
      <polygon points="30,52 42,39 38,39 29,50" fill="#fff" opacity="0.6"/>

      <!-- Boom & Arm -->
      <path d="M 62 54 L 74 20 Q 77 12 85 16 L 94 34 L 88 40 L 78 24 L 68 58 Z" fill="url(#goldText)" stroke="#111" stroke-width="1.5"/>
      <path d="M 85 16 L 98 44 L 92 48 L 80 20 Z" fill="url(#goldText)" stroke="#111" stroke-width="1.5"/>
      <!-- Bucket -->
      <path d="M 97 42 Q 108 47 102 60 Q 92 64 88 56 Z" fill="#2b2d30" stroke="#f5a400" stroke-width="2"/>
      <polygon points="102,58 105,62 102,63" fill="#f5a400"/>
      <polygon points="98,60 101,64 97,64" fill="#f5a400"/>
    </g>
  </g>

  <!-- Typography: HUSNI RENTAL -->
  <g transform="translate(86, 0)">
    <!-- Main text HUSNI -->
    <text x="0" y="44" font-family="'Inter', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="38" letter-spacing="1" fill="#111" stroke="#000" stroke-width="4">HUSNI</text>
    <text x="0" y="44" font-family="'Inter', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="38" letter-spacing="1" fill="url(#goldText)">HUSNI</text>
    
    <!-- Sub text RENTAL EXCAVATOR -->
    <text x="2" y="66" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="15" letter-spacing="3" fill="#111" stroke="#000" stroke-width="2.5">RENTAL EXCAVATOR</text>
    <text x="2" y="66" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="15" letter-spacing="3" fill="url(#silverText)">RENTAL EXCAVATOR</text>
  </g>
</svg>
